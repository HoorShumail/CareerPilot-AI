[project]
name = "careerpilot-ai"
version = "0.1.0"
description = "AI Career Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    # FastAPI Backend
    "fastapi[standard]>=0.111.0",,
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.7",
    
    # AI / Agents
    "openai>=1.30.0",
    "langchain>=0.2.6",
    "langchain-core>=0.2.10",
    "langchain-openai>=0.1.13",
    "langgraph>=0.1.4",
    "langchain-community>=0.2.6",
    "langgraph-checkpoint-postgres>=1.0.1",
    "chromadb>=0.5.3",
    
    # File Parsing
    "pymupdf>=1.24.7",
    "python-docx>=1.1.2",
    
    # Celery
    "celery>=5.4.0",
    
    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.4.2",
    "orjson>=3.10.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "testcontainers>=4.7.1",
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.1.0"
]
web = [
    "streamlit>=1.36.0",
    "requests>=2.32.3",
    "plotly>=5.22.0",
    "pandas>=2.2.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
